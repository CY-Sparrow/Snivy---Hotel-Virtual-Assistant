<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/snivy.css') }}">
</head>
<body>

    <!-- Floating toggle button - visible when chat is closed -->
    <button class="chat-toggle-btn" id="chatToggleBtn" onclick="toggleChat()" aria-label="Open chat">
        <svg id="toggleIconOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
    </button>

    <div class="chatbot" id="chatbot">
    <div class="chatwindow" id="chatwindow">
        
        <header class="chat-header">
            
            <div class="bot-info">
                <div class="avtar">S</div>
                <div class="bot-i">
                    <div class="bot-name">Snivy</div>
                    <div class="bot-des">Virtual Assistant - made by Yuvi</div>
                </div>
            </div>   
            <div class="close-btn" onclick="toggleChat()" aria-label="Close chat">&times;</div>   
        
        </header>
        
        <main class="chat-main">
            <div class="today">Today</div>
            <div class="messages" id="message"></div>
             <div class="suggestions" id="suggest"></div>
             <!-- Add this AFTER the <div class="suggestions" id="suggest"></div> line -->

            <!-- Form for Complaints -->
            <div class="form-container" id="complaintForm" style="display:none;">
                <h3>Submit Your Complaint</h3>
                <textarea  id="complaintText" placeholder="Please describe your complaint" required></textarea>
                <button onclick="submitComplaint()">Submit Complaint</button>
                <button onclick="cancelForm()">Cancel</button>
            </div>

            <!-- Form for Booking Issues -->
            <div class="form-container" id="bookIssueForm" style="display:none;">
                <h3>Submit Your Book Issue</h3>
                <textarea  id="bookIssueText" placeholder="Please describe your booking issue" required></textarea>
                <button onclick="submitBookIssue()">Submit Book Issue</button>
                <button onclick="cancelForm()">Cancel</button>
            </div>

            <!-- Form for Contact Messages -->
            <div class="form-container" id="messageForm" style="display:none;">
                <h3>Send Us a Message</h3>
                <textarea id="messageText" placeholder="Your message here" required></textarea>
                <button onclick="submitMessage()">Send Message</button>
                <button onclick="cancelForm()">Cancel</button>
            </div>

            <!-- Form for Delete Requests -->
            <div class="form-container" id="deleteForm" style="display:none;">
                <h3>Request Deletion</h3>
                <input type="text" id="deleteText" placeholder="EX:cp-H722NRAZ" required>
                <button onclick="submitDelete()">Submit Request</button>
                <button onclick="cancelForm()">Cancel</button>
            </div>

        </main>    
        
    </div>    
</div>    

    <script src="{{ url_for('static', filename='js/snivy.js') }}"></script>
    
</body>

</html>
